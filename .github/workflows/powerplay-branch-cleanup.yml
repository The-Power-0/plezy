name: Archive obsolete PowerPlay branches
on:
  push:
    branches:
      - main
    paths:
      - '.github/powerplay/branch-cleanup.request.json'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: powerplay-branch-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preserve branch tips, remove obsolete names, and retain the active default
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/powerplay/archive_branches.py --apply
