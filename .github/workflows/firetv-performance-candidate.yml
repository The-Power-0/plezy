name: Fire TV Optimized APK Test
run-name: Fire TV release candidate (${{ inputs.upstream_tag || 'latest' }})

# Manually started test. Never publishes a release or updates Home Assistant.
on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Exact upstream release tag, or blank for latest'
        type: string
        required: false
        default: '2.25.0'

permissions:
  contents: read

concurrency:
  group: firetv-optimized-test
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'
  UPSTREAM_REPO: edde746/plezy

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout maintained build logic
        uses: actions/checkout@v5
        with:
          ref: ha-shuffle-v2
          fetch-depth: 0

      - name: Resolve upstream version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-}"
          if [[ -z "$TAG" ]]; then
            TAG="$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)"
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Invalid upstream release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream source with existing HA shuffle compatibility
        id: source
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cp HA-SHUFFLE-NOTICE.md "$RUNNER_TEMP/HA-SHUFFLE-NOTICE.md"
          cp .github/patches/apply_legacy_shuffle.py "$RUNNER_TEMP/apply_legacy_shuffle.py"
          cp .github/patches/prepare_custom_source.sh "$RUNNER_TEMP/prepare_custom_source.sh"
          cp .github/patches/ha-shuffle.patch "$RUNNER_TEMP/ha-shuffle.patch"
          git remote add upstream-release https://github.com/edde746/plezy.git
          git fetch --force upstream-release "refs/tags/$UPSTREAM_TAG:refs/tags/_candidate_$UPSTREAM_TAG"
          git checkout --detach "refs/tags/_candidate_$UPSTREAM_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash "$RUNNER_TEMP/prepare_custom_source.sh" "$UPSTREAM_TAG"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BUILDING-CUSTOM-FIRE-TV.md")
          t = p.read_text()
          changes = {
            "flutter build apk --debug --split-per-abi": "flutter build apk --release --target-platform android-arm --split-per-abi",
            "app-armeabi-v7a-debug.apk": "app-armeabi-v7a-release.apk",
          }
          for old, new in changes.items():
            if t.count(old) != 1:
              raise SystemExit("BUILDING documentation changed; review: " + old)
            t = t.replace(old, new)
          t += "\nThe candidate is release-signed via android/key.properties set by CI.\n"
          t += "The private signing key is not in this archive. See the test workflow.\n"
          p.write_text(t)
          PY
          git add BUILDING-CUSTOM-FIRE-TV.md
          git commit -m "docs: describe candidate release compilation and signing"
          test -s LICENSE
          test -s HA-SHUFFLE-NOTICE.md
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies and test deep links
        env:
          IMPLEMENTATION: ${{ steps.source.outputs.implementation }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          if ! git diff --quiet -- pubspec.lock; then
            git add pubspec.lock
            git commit -m "build: pin candidate dependency resolution"
          fi
          if [[ "$IMPLEMENTATION" == legacy ]]; then
            flutter test test/utils/shuffle_show_deep_link_test.dart
            flutter analyze lib/utils/shuffle_show_deep_link.dart
          else
            flutter test test/services/deep_links/legacy_shuffle_link_test.dart
            flutter test test/services/deep_links/deep_link_test.dart
            flutter analyze lib/services/deep_links/deep_link.dart
          fi

      - name: Configure same signing key for RELEASE build type
        env:
          KEYSTORE_BASE64: ${{ secrets.PLEZY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "PLEZY_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/debug.keystore
          EOF
          chmod 600 android/key.properties

      - name: Build Fire TV ARMv7 AOT release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm --split-per-abi
          FILE="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          test -s "$FILE"
          cp "$FILE" Plezy-FireTV-ReleaseCandidate.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("Plezy-FireTV-ReleaseCandidate.apk") as apk:
            files = set(apk.namelist())
            for required in ("lib/armeabi-v7a/libapp.so", "lib/armeabi-v7a/libflutter.so"):
              if required not in files:
                raise SystemExit("Release AOT library missing: " + required)
            native_abis = {p.split("/")[1] for p in files if p.startswith("lib/") and p.endswith(".so")}
            if native_abis != {"armeabi-v7a"}:
              raise SystemExit("Unexpected native ABIs: " + repr(native_abis))
          PY
          sha256sum Plezy-FireTV-ReleaseCandidate.apk > Plezy-FireTV-ReleaseCandidate.apk.sha256

      - name: Validate Android 9 and 11 signatures against existing published APK
        id: signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --min-sdk-version 28 --print-certs Plezy-FireTV-ReleaseCandidate.apk > "$RUNNER_TEMP/new-cert.txt"
          "$APKSIGNER" verify --min-sdk-version 30 Plezy-FireTV-ReleaseCandidate.apk
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt" | head -1)"
          test -n "$NEW_CERT"
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          mkdir -p "$RUNNER_TEMP/baseline"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Plezy.apk --dir "$RUNNER_TEMP/baseline"
          BASELINE="$RUNNER_TEMP/baseline/Plezy.apk"
          test -s "$BASELINE"
          "$APKSIGNER" verify --min-sdk-version 28 --print-certs "$BASELINE" > "$RUNNER_TEMP/old-cert.txt"
          OLD_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-cert.txt" | head -1)"
          test -n "$OLD_CERT"
          if [[ "$NEW_CERT" != "$OLD_CERT" ]]; then
            echo "Signing certificate mismatch. Abort." >&2
            exit 1
          fi
          echo "baseline_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "baseline_bytes=$(stat -c %s "$BASELINE")" >> "$GITHUB_OUTPUT"
          echo "candidate_bytes=$(stat -c %s Plezy-FireTV-ReleaseCandidate.apk)" >> "$GITHUB_OUTPUT"
          echo "certificate=$NEW_CERT" >> "$GITHUB_OUTPUT"

      - name: Archive GPL source and write performance comparison
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          BASELINE_TAG: ${{ steps.signature.outputs.baseline_tag }}
          BASELINE_BYTES: ${{ steps.signature.outputs.baseline_bytes }}
          CANDIDATE_BYTES: ${{ steps.signature.outputs.candidate_bytes }}
          SIGNING_CERT: ${{ steps.signature.outputs.certificate }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=plezy-custom-source/ HEAD | gzip -9 > Plezy-FireTV-ReleaseCandidate-Source.tar.gz
          tar -tzf Plezy-FireTV-ReleaseCandidate-Source.tar.gz | grep -Fx 'plezy-custom-source/LICENSE'
          tar -tzf Plezy-FireTV-ReleaseCandidate-Source.tar.gz | grep -Fx 'plezy-custom-source/BUILDING-CUSTOM-FIRE-TV.md'
          sha256sum Plezy-FireTV-ReleaseCandidate-Source.tar.gz > Plezy-FireTV-ReleaseCandidate-Source.tar.gz.sha256
          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "build_mode=release"
            echo "target_abi=armeabi-v7a"
            echo "baseline_tag=$BASELINE_TAG"
            echo "baseline_apk_bytes=$BASELINE_BYTES"
            echo "candidate_apk_bytes=$CANDIDATE_BYTES"
            echo "signing_cert_sha256=$SIGNING_CERT"
            echo "verified_api_levels=28,30"
            echo "github_release_published=false"
          } > Plezy-FireTV-ReleaseCandidate-build-info.txt
          {
            echo "## Optimized Plezy Fire TV release candidate"
            echo "No GitHub Release created; no Home Assistant updates triggered."
            echo ""
            echo "| Measurement | Value |"
            echo "|---|---|"
            echo "| Existing APK | $BASELINE_BYTES bytes ($BASELINE_TAG) |"
            echo "| Candidate APK | $CANDIDATE_BYTES bytes |"
            echo "| Dart compilation | AOT release (ARMv7) |"
            echo "| Signatures | Android 9 and 11 verified, certificate matches existing APK |"
            echo "| GPL source | Uploaded alongside candidate |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload testing artifacts, not a release
        uses: actions/upload-artifact@v4
        with:
          name: Plezy-FireTV-Optimized-Test
          path: |
            Plezy-FireTV-ReleaseCandidate.apk
            Plezy-FireTV-ReleaseCandidate.apk.sha256
            Plezy-FireTV-ReleaseCandidate-Source.tar.gz
            Plezy-FireTV-ReleaseCandidate-Source.tar.gz.sha256
            Plezy-FireTV-ReleaseCandidate-build-info.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Delete signing materials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.android/debug.keystore" android/key.properties
