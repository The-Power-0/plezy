name: PowerPlay Fire TV Release Candidate
run-name: PowerPlay candidate — ${{ github.ref_name }}

on:
  push:
    branches:
      - 'release/powerplay-v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: powerplay-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      FLUTTER_VERSION: '3.47.9'
    steps:
      - name: Checkout release machinery
        uses: actions/checkout@v5
      - name: Load release version and published source pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          data = json.loads(Path('.github/powerplay/release.json').read_text())
          assert re.fullmatch(r'\d+\.\d+\.\d+', data['version'])
          assert type(data['build_number']) is int and data['build_number'] > 10000
          for key in ('baseline_source_sha256', 'baseline_native_sha256'):
              assert re.fullmatch(r'[0-9a-f]{64}', data[key])
          assert data['baseline_tag'] == 'powerplay-v1.0.0'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for key, value in data.items():
                  name = 'RELEASE_VERSION' if key == 'version' else key.upper()
                  out.write(f'{name}={value}\n')
          PYTHON
      - name: Restore pinned published PowerPlay 1.0.0 source and native inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frozen" "$RUNNER_TEMP/powerplay"
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'PowerPlay-v1.0.0-Source.tar.gz' \
            --pattern 'PowerPlay-v1.0.0-NativeSourceInputs.zip' \
            --dir "$RUNNER_TEMP/frozen"
          cd "$RUNNER_TEMP/frozen"
          echo "$BASELINE_SOURCE_SHA256  PowerPlay-v1.0.0-Source.tar.gz" | sha256sum -c -
          echo "$BASELINE_NATIVE_SHA256  PowerPlay-v1.0.0-NativeSourceInputs.zip" | sha256sum -c -
          tar -xzf PowerPlay-v1.0.0-Source.tar.gz -C "$RUNNER_TEMP/powerplay"
          test -s "$RUNNER_TEMP/powerplay/plezy-custom-source/LICENSE"
          cp PowerPlay-v1.0.0-NativeSourceInputs.zip "$RUNNER_TEMP/powerplay/native-source-inputs.zip"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply PowerPlay defaults and branding changes to the published source
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/powerplay/test_fix_splash_background.py"
          python3 "$GITHUB_WORKSPACE/.github/powerplay/apply_next_version.py" \
            --source "$RUNNER_TEMP/powerplay/plezy-custom-source"
          # The APK uses the pinned 1.0.0 source, not the repository-root app.
          # Patch the exact source *after* retained 1.1.x changes, fail on
          # mismatches rather than accidentally shipping an unthemed release.
          if ! git -C "$RUNNER_TEMP/powerplay/plezy-custom-source" apply --check \
            "$GITHUB_WORKSPACE/.github/powerplay/theme-presets.patch"; then
            python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'powerplay/plezy-custom-source'
          targets = {
              'lib/main.dart': ['theme/mono_theme.dart', 'StartupThemeResolution', 'resolveStartupTheme', 'theme: widget.lightTheme'],
              'lib/providers/theme_provider.dart': ['class ThemeProvider', 'monoTheme(', 'settingsBinding', 'darkThemeFor'],
              'lib/screens/settings/appearance_settings_screen.dart': ['class AppearanceSettingsScreen', '_themeSelector', 'SettingsGroup'],
              'lib/services/settings_service.dart': ['enum ThemeMode', 'static const themeMode', 'navigation_tabs.dart'],
              'lib/theme/mono_theme.dart': ['ThemeData monoTheme', 'final (', 'ColorScheme(', 'return base.copyWith'],
              'test/providers/theme_provider_test.dart': ["group('ThemeProvider'", 'ThemeProvider()'],
              'test/startup_bootstrap_test.dart': ['resolved.complete', 'StartupThemeResolution'],
              'test/theme/mono_theme_test.dart': ['void main', 'monoTheme('],
          }
          for rel, terms in targets.items():
              path = root / rel
              print(f'=== {rel} ===', flush=True)
              if not path.exists():
                  print('MISSING FILE', flush=True)
                  continue
              lines = path.read_text().splitlines()
              hits = [i for i, line in enumerate(lines) if any(term in line for term in terms)]
              shown = set()
              for i in hits[:7]:
                  for j in range(max(0,i-5), min(len(lines), i+13)):
                      if j not in shown:
                          print(f'{j+1}: {lines[j]}', flush=True)
                          shown.add(j)
                  print('--', flush=True)
              if rel.endswith('mono_theme.dart'):
                  for j in range(min(125,len(lines))):
                      if j not in shown:
                          print(f'{j+1}: {lines[j]}', flush=True)
          PY
            exit 1
          fi
          git -C "$RUNNER_TEMP/powerplay/plezy-custom-source" apply \
            "$GITHUB_WORKSPACE/.github/powerplay/theme-presets.patch"
          python3 "$GITHUB_WORKSPACE/.github/powerplay/check_next_version.py" \
            --source "$RUNNER_TEMP/powerplay/plezy-custom-source"
          echo "PowerPlay $RELEASE_VERSION: retained features, matched splash, and six OLED-compatible theme presets applied." >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve and test
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/powerplay/plezy-custom-source"
          flutter pub get
          flutter test test/providers/fire_tv_library_defaults_test.dart test/providers/hidden_libraries_provider_test.dart test/providers/libraries_provider_test.dart test/utils/platform_detector_test.dart test/widgets/library_management_sheet_test.dart test/navigation/profile_session_screen_test.dart test/services/storage_service_test.dart
          flutter test test/services/powerplay_defaults_test.dart test/services/settings_service_test.dart test/services/settings_export_service_test.dart
          flutter test test/theme/mono_theme_test.dart test/providers/theme_provider_test.dart test/startup_bootstrap_test.dart test/screens/settings/appearance_settings_screen_test.dart
          flutter test test/services/deep_links/legacy_shuffle_link_test.dart
          flutter test test/services/deep_links/deep_link_test.dart
      - name: Configure existing Fire TV test signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.PLEZY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "Missing PLEZY_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/powerplay.keystore"
          chmod 600 "$HOME/.android/powerplay.keystore"
          keytool -list -keystore "$HOME/.android/powerplay.keystore" -storepass android -alias androiddebugkey >/dev/null
          cd "$RUNNER_TEMP/powerplay/plezy-custom-source"
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$HOME/.android/powerplay.keystore
          EOF
          chmod 600 android/key.properties
      - name: Compile optimized PowerPlay ARMv7 release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/powerplay/plezy-custom-source"
          flutter build apk --release --target-platform android-arm --split-per-abi \
            --dart-define=PLEZY_FIRETV_PLEX_ONLY=true \
            --dart-define=PLEZY_FIRETV_FORCE_EXO_VIDEO=true \
            --dart-define=PLEZY_FIRETV_MOVIES_TV_ONLY=true \
            --dart-define=PLEZY_FIRETV_NO_EXTERNAL_SERVICES=true \
            --dart-define=PLEZY_FIRETV_NO_WATCH_TOGETHER=true \
            --dart-define=PLEZY_FIRETV_NO_COMPANION_REMOTE=true \
            --dart-define=PLEZY_HA_MANAGED_UPDATES=true
          mkdir -p "$GITHUB_WORKSPACE/powerplay-release"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/powerplay-release/PowerPlay-v$RELEASE_VERSION-rc1.apk"
      - name: Check actual APK identity, ABI, signing, and MPV absence
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/powerplay-release"
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_TOOLS/aapt" dump badging PowerPlay-v$RELEASE_VERSION-rc1.apk > apk-badging.txt
          grep -q "package: name='com.power.powerplay'" apk-badging.txt
          grep -q "versionName='$RELEASE_VERSION'" apk-badging.txt
          # Flutter adds the armeabi-v7a ABI offset (1000) to the base build number.
          EXPECTED_APK_VERSION_CODE=$((BUILD_NUMBER + 1000))
          grep -q "versionCode='$EXPECTED_APK_VERSION_CODE'" apk-badging.txt
          "$SDK_TOOLS/apksigner" verify --min-sdk-version 28 --print-certs PowerPlay-v$RELEASE_VERSION-rc1.apk > signing.txt
          "$SDK_TOOLS/apksigner" verify --min-sdk-version 30 PowerPlay-v$RELEASE_VERSION-rc1.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os
          with ZipFile(f"PowerPlay-v{os.environ['RELEASE_VERSION']}-rc1.apk") as a:
              ns=a.namelist()
              expected=Path(os.environ['RUNNER_TEMP']) / 'powerplay/plezy-custom-source/assets/powerplay.png'
              assert a.read('assets/flutter_assets/assets/powerplay.png') == expected.read_bytes()
              abis={p.split("/")[1] for p in ns if p.startswith("lib/") and p.endswith(".so")}
              assert abis=={"armeabi-v7a"}, abis
              assert "lib/armeabi-v7a/libflutter.so" in ns
              assert "lib/armeabi-v7a/libapp.so" in ns
              assert any(p.endswith("libffmpegJNI.so") for p in ns)
              assert not any("mpv" in p.lower() and p.endswith(".so") for p in ns)
          PY
          sha256sum PowerPlay-v$RELEASE_VERSION-rc1.apk > PowerPlay-v$RELEASE_VERSION-rc1.apk.sha256
      - name: Archive corresponding source and source inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/powerplay"
          tar -czf "$GITHUB_WORKSPACE/powerplay-release/PowerPlay-v$RELEASE_VERSION-rc1-Source.tar.gz" \
            --exclude='plezy-custom-source/build' \
            --exclude='plezy-custom-source/.dart_tool' \
            --exclude='plezy-custom-source/android/.gradle' \
            --exclude='plezy-custom-source/android/app/build' \
            --exclude='plezy-custom-source/android/key.properties' \
            plezy-custom-source
          cp native-source-inputs.zip "$GITHUB_WORKSPACE/powerplay-release/PowerPlay-v$RELEASE_VERSION-rc1-NativeSourceInputs.zip"
          cd "$GITHUB_WORKSPACE/powerplay-release"
          sha256sum PowerPlay-v$RELEASE_VERSION-rc1-Source.tar.gz PowerPlay-v$RELEASE_VERSION-rc1-NativeSourceInputs.zip > sources.sha256
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          data = json.loads(Path('../.github/powerplay/release.json').read_text())
          data['source_sha'] = os.environ['GITHUB_SHA']
          Path('release-manifest.json').write_text(json.dumps(data, indent=2) + '\n')
          PYTHON
          printf '%s\n' 'PowerPlay Release Candidate'  "Based on pinned published PowerPlay 1.0.0 source" "PowerPlay $RELEASE_VERSION defaults, splash, curated themes with OLED, About, and release policy; device validation pending." 'NOT A PUBLIC RELEASE YET.' > BUILD-STATUS.txt
      - name: Upload signed candidate for review (no public release)
        uses: actions/upload-artifact@v4
        with:
          name: PowerPlay-v${{ env.RELEASE_VERSION }}-rc1-Candidate
          path: powerplay-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Delete signing credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.android/powerplay.keystore" "$RUNNER_TEMP/powerplay/plezy-custom-source/android/key.properties"
