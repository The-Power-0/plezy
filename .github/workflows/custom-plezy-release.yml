
name: Build Custom Plezy Release

run-name: Custom Plezy ${{ github.event.inputs.upstream_tag || 'latest upstream release' }}

on:
  # Disabled upstream polling for the independent PowerPlay fork.
  # Legacy Plezy builds remain opt-in via workflow_dispatch.
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream Plezy release tag; leave blank for latest"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: custom-plezy-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: edde746/plezy
  FLUTTER_VERSION: "3.47.0"
  CUSTOM_REVISION: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ═════════════════════════════════════
      # CHECKOUT OUR CUSTOM BRANCH
      # ═════════════════════════════════════
      - name: Checkout custom branch
        uses: actions/checkout@v5
        with:
          ref: ha-shuffle-v2
          fetch-depth: 0

      # ═════════════════════════════════════
      # RESOLVE LATEST UPSTREAM RELEASE
      # ═════════════════════════════════════
      - name: Resolve upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Upstream:   $UPSTREAM_REPO"

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            UPSTREAM_TAG="$REQUESTED_TAG"
            UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}/releases/tag/${UPSTREAM_TAG}"

            echo "Manual upstream tag requested: $UPSTREAM_TAG"

          else
            echo "Looking up latest upstream release..."

            RELEASE_JSON="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${UPSTREAM_REPO}/releases/latest"
            )"

            UPSTREAM_TAG="$(jq -r '.tag_name' <<< "$RELEASE_JSON")"
            UPSTREAM_URL="$(jq -r '.html_url' <<< "$RELEASE_JSON")"

            if [[ -z "$UPSTREAM_TAG" || "$UPSTREAM_TAG" == "null" ]]; then
              echo "GitHub returned no upstream release tag." >&2
              exit 1
            fi
          fi

          CUSTOM_TAG="${UPSTREAM_TAG}-ha-shuffle.${CUSTOM_REVISION}"

          echo
          echo "Upstream tag: $UPSTREAM_TAG"
          echo "Custom tag:   $CUSTOM_TAG"
          echo

          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$UPSTREAM_URL" >> "$GITHUB_OUTPUT"
          echo "custom_tag=$CUSTOM_TAG" >> "$GITHUB_OUTPUT"

          # Check whether our matching custom release already exists.
          #
          # 200 = already built
          # 404 = needs building
          # anything else = real API failure
          HTTP_STATUS="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              -i \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${CUSTOM_TAG}" \
              2>/dev/null |
            awk '/^HTTP\// {status=$2} END {print status}'
          )" || true

          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"

            echo
            echo "Custom release already exists:"
            echo "$CUSTOM_TAG"
            echo
            echo "Nothing to build."

          elif [[ "$HTTP_STATUS" == "404" ]]; then
            echo "build_needed=true" >> "$GITHUB_OUTPUT"

            echo
            echo "No matching custom release exists."
            echo "Building $CUSTOM_TAG."

          else
            echo "Unable to determine whether custom release exists." >&2
            echo "GitHub API HTTP status: ${HTTP_STATUS:-unknown}" >&2
            exit 1
          fi

      # ═════════════════════════════════════
      # CLEAN SUCCESSFUL EXIT WHEN CURRENT
      # ═════════════════════════════════════
      - name: Already up to date
        if: steps.release.outputs.build_needed == 'false'
        shell: bash
        run: |
          echo "Latest upstream release:"
          echo "${{ steps.release.outputs.upstream_tag }}"
          echo
          echo "Matching custom release already exists:"
          echo "${{ steps.release.outputs.custom_tag }}"
          echo
          echo "No build required."

      # ═════════════════════════════════════
      # PREPARE EXACT UPSTREAM RELEASE SOURCE
      # ═════════════════════════════════════
      - name: Prepare upstream release source
        if: steps.release.outputs.build_needed == 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail

          cp HA-SHUFFLE-NOTICE.md "$RUNNER_TEMP/HA-SHUFFLE-NOTICE.md"
          cp .github/patches/apply_legacy_shuffle.py "$RUNNER_TEMP/apply_legacy_shuffle.py"
          cp .github/patches/prepare_custom_source.sh "$RUNNER_TEMP/prepare_custom_source.sh"
          cp .github/patches/ha-shuffle.patch "$RUNNER_TEMP/ha-shuffle.patch"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/edde746/plezy.git

          git fetch --force upstream \
            "refs/tags/${{ steps.release.outputs.upstream_tag }}:refs/tags/_upstream_${{ steps.release.outputs.upstream_tag }}"

          git checkout --detach \
            "refs/tags/_upstream_${{ steps.release.outputs.upstream_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bash "$RUNNER_TEMP/prepare_custom_source.sh" "${{ steps.release.outputs.upstream_tag }}"

      # ═════════════════════════════════════
      # JAVA
      # ═════════════════════════════════════
      - name: Setup Java
        if: steps.release.outputs.build_needed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ═════════════════════════════════════
      # FLUTTER
      # ═════════════════════════════════════
      - name: Setup Flutter
        if: steps.release.outputs.build_needed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ═════════════════════════════════════
      # DEPENDENCIES
      # ═════════════════════════════════════
      - name: Install dependencies
        if: steps.release.outputs.build_needed == 'true'
        run: flutter pub get

      # ═════════════════════════════════════
      # SIGNING KEY
      # ═════════════════════════════════════
      - name: Restore signing key
        if: steps.release.outputs.build_needed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLEZY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "PLEZY_KEYSTORE_BASE64 secret is missing." >&2
            exit 1
          fi

          mkdir -p "$HOME/.android"

          echo "$KEYSTORE_BASE64" |
            base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      # ═════════════════════════════════════
      # TEST CUSTOM PATCH
      # ═════════════════════════════════════
      - name: Test shuffle deep link
        if: steps.release.outputs.build_needed == 'true'
        run: |
          if [[ "${{ steps.source.outputs.implementation }}" == "legacy" ]]; then
            flutter test test/utils/shuffle_show_deep_link_test.dart
            flutter analyze lib/utils/shuffle_show_deep_link.dart
            flutter analyze lib/screens/main_screen.dart
          else
            flutter test test/services/deep_links/legacy_shuffle_link_test.dart
            flutter analyze lib/services/deep_links/deep_link.dart
          fi

      # ═════════════════════════════════════
      # VERIFY UPSTREAM VERSION
      # ═════════════════════════════════════
      - name: Verify upstream version
        if: steps.release.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          BASE_VERSION="${VERSION%%+*}"

          RELEASE_TAG="${{ steps.release.outputs.upstream_tag }}"
          TAG_VERSION="${RELEASE_TAG#v}"

          echo "pubspec version: $BASE_VERSION"
          echo "upstream tag:    $RELEASE_TAG"

          if [[ "$BASE_VERSION" != "$TAG_VERSION" ]]; then
            echo \
              "Upstream tag $RELEASE_TAG does not match pubspec version $BASE_VERSION" \
              >&2
            exit 1
          fi

      # ═════════════════════════════════════
      # BUILD FIRE TV APK
      # ═════════════════════════════════════
      - name: Build Fire TV APK
        if: steps.release.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk \
            --debug \
            --split-per-abi

          APK="build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "Expected Fire TV APK was not produced:" >&2
            echo "$APK" >&2
            exit 1
          fi

          cp "$APK" Plezy.apk

          sha256sum Plezy.apk > Plezy.apk.sha256

          echo "===== APK ====="
          ls -lh Plezy.apk

          echo
          echo "===== SHA256 ====="
          cat Plezy.apk.sha256

      # ═════════════════════════════════════
      # VERIFY SIGNATURE
      # ═════════════════════════════════════
      - name: Verify APK signature
        if: steps.release.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -1
          )"

          "$BUILD_TOOLS/apksigner" verify \
            --print-certs \
            Plezy.apk

      - name: Package corresponding GPL source
        if: steps.release.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s LICENSE
          test -s HA-SHUFFLE-NOTICE.md
          test -s BUILDING-CUSTOM-FIRE-TV.md
          git archive --format=tar --prefix=plezy-custom-source/ HEAD |
            gzip -9 > Plezy-Source.tar.gz
          tar -tzf Plezy-Source.tar.gz | grep -Fx 'plezy-custom-source/LICENSE'
          sha256sum Plezy-Source.tar.gz > Plezy-Source.tar.gz.sha256

      # ═════════════════════════════════════
      # PUBLISH CUSTOM RELEASE
      #
      # FIX:
      # Let GitHub create the release tag.
      # Do not push the temporary patched source commit.
      # ═════════════════════════════════════
      - name: Publish custom release
        if: steps.release.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_TAG: ${{ steps.release.outputs.custom_tag }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          UPSTREAM_URL: ${{ steps.release.outputs.upstream_url }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          # Verify release assets before publishing.
          test -s Plezy.apk
          test -s Plezy.apk.sha256
          test -s Plezy-Source.tar.gz
          test -s Plezy-Source.tar.gz.sha256

          echo "Publishing custom Plezy release..."
          echo "Upstream: $UPSTREAM_TAG"
          echo "Custom:   $CUSTOM_TAG"
          echo "Source:   $SOURCE_COMMIT"

          # Write release notes.
          cat > /tmp/release-notes.md <<EOF
          Custom Plezy build based on upstream release **$UPSTREAM_TAG**.

          Includes:
          - \`plezy://shuffle?server=<serverId>&show=<showRatingKey>\`
          - Plezy's native continuous shuffled-show playback
          - Fire TV \`armeabi-v7a\` APK
          - Signed with the same key used by existing custom Fire TV installations

          Upstream release:
          $UPSTREAM_URL

          Patched build source commit:
          \`$SOURCE_COMMIT\`

          GPL-3.0 corresponding source: Plezy-Source.tar.gz (attached).
          GitHub autogenerated archives are NOT the APK build source.
          This is an unofficial derivative of edde746/plezy.

          Build and test workflow:
          https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          # Create the release and tag directly through GitHub.
          # The tag targets our maintained branch rather than
          # the temporary patched upstream commit.
          #
          # This avoids workflow-file permission errors.
          gh release create "$CUSTOM_TAG" \
            Plezy.apk \
            Plezy.apk.sha256 \
            Plezy-Source.tar.gz \
            Plezy-Source.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target ha-shuffle-v2 \
            --latest \
            --title "Plezy $UPSTREAM_TAG + HA Shuffle" \
            --notes-file /tmp/release-notes.md

          echo
          echo "Release published successfully:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${CUSTOM_TAG}"

          # Confirm the release is published and both assets exist.
          RELEASE_JSON="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${CUSTOM_TAG}"
          )"

          echo "$RELEASE_JSON" | jq -e '
            .draft == false and
            ([.assets[].name] |
              index("Plezy.apk") != null and
              index("Plezy.apk.sha256") != null and
              index("Plezy-Source.tar.gz") != null and
              index("Plezy-Source.tar.gz.sha256") != null)
          '

          echo "Release and assets verified."

      # ═════════════════════════════════════
      # CLEAN SIGNING KEY
      # ═════════════════════════════════════
      - name: Clean signing key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.android/debug.keystore"
