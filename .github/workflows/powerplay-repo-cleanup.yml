name: Archive legacy Plezy releases
run-name: Archive pre-PowerPlay releases and preserve rollback assets
on:
  push:
    branches:
      - ha-shuffle-v2
    paths:
      - '.github/powerplay/archive-legacy.request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: powerplay-legacy-release-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate and archive the four explicitly requested legacy releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/powerplay/archive_legacy_releases.py --apply
